<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Primary SEO -->
    <title>Hampstead Wellbeing | Wellbeing Directory for Yoga, Pilates, Meditation &amp; Fitness</title>
    <meta name="description" content="A curated wellbeing directory of yoga, Pilates, meditation and fitness providers across the UK, plus online classes and apps you can use anywhere, women's yoga retreats and corporate wellness." />
    <meta name="author" content="Hampstead Wellbeing Ltd" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.hampsteadwellbeing.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hampsteadwellbeing.com/" />
    <meta property="og:site_name" content="Hampstead Wellbeing" />
    <meta property="og:title" content="Hampstead Wellbeing | Wellbeing Directory for Yoga, Pilates, Meditation &amp; Fitness" />
    <meta property="og:description" content="A curated wellbeing directory of yoga, Pilates, meditation and fitness providers across the UK, plus online classes and apps you can use anywhere, women's yoga retreats and corporate wellness." />
    <meta property="og:image" content="https://www.hampsteadwellbeing.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hampstead Wellbeing | Wellbeing Directory for Yoga, Pilates, Meditation &amp; Fitness" />
    <meta name="twitter:description" content="A curated wellbeing directory of yoga, Pilates, meditation and fitness providers across the UK, plus online classes and apps you can use anywhere, women's yoga retreats and corporate wellness." />
    <meta name="twitter:image" content="https://www.hampsteadwellbeing.com/opengraph.jpg" />

    <!-- Structured Data: Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HealthAndBeautyBusiness",
      "name": "Hampstead Wellbeing",
      "legalName": "Hampstead Wellbeing Ltd",
      "url": "https://www.hampsteadwellbeing.com",
      "logo": "https://www.hampsteadwellbeing.com/images/hw-logo.png",
      "image": "https://www.hampsteadwellbeing.com/opengraph.jpg",
      "description": "Hampstead Wellbeing helps individuals and organisations find holistic, tailored solutions to mitigate burnout and stress. We offer yoga retreats, Hatha yoga classes, wellness facilitation and a curated wellbeing directory.",
      "email": "hampsteadwellbeing@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Hampstead",
        "addressRegion": "London",
        "addressCountry": "GB"
      },
      "areaServed": "GB",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Wellbeing Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Self Appreciation Journeys — Yoga Retreat",
              "description": "Annual ladies-only residential yoga retreat for self-love in the Dordogne, France — seven days of yoga, meditation, self-love workshops and woodland walks in the Périgord Vert."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Weekly Hatha Yoga Classes",
              "description": "Term-time weekly in-person Hatha Yoga classes at a local London venue. Maximum 15 students per class."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Corporate Wellness Facilitation",
              "description": "Holistic, tailored solutions for organisations to mitigate burnout and stress, including coaching, group activities and wellness assessments."
            }
          }
        ]
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>

  </body>
</html>
