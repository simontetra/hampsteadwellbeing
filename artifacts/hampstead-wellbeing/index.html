  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO -->
    <title>Hampstead Wellbeing | Holistic Wellbeing &amp; Education Centre</title>

    <meta name="author" content="Hampstead Wellbeing Ltd" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.hampsteadwellbeing.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hampsteadwellbeing.com/" />
    <meta property="og:site_name" content="Hampstead Wellbeing" />
    <meta property="og:title" content="Hampstead Wellbeing | Holistic Wellbeing &amp; Education Centre" />
    <meta property="og:description" content="A safe place to support your wellbeing. We promote holistic self-care, run yoga retreats in the Dordogne, weekly Hatha yoga classes, and connect you with education and wellness resources." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hampstead Wellbeing | Holistic Wellbeing &amp; Education Centre" />

    <meta name="twitter:image" content="https://www.hampsteadwellbeing.com/opengraph.jpg" />

    <!-- Structured Data: Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HealthAndBeautyBusiness",
      "name": "Hampstead Wellbeing",
      "legalName": "Hampstead Wellbeing Ltd",
      "url": "https://www.hampsteadwellbeing.com",
      "logo": "https://www.hampsteadwellbeing.com/images/hw-logo.png",
      "image": "https://www.hampsteadwellbeing.com/opengraph.jpg",
      "description": "Hampstead Wellbeing helps individuals and organisations find holistic, tailored solutions to mitigate burnout and stress. We offer yoga retreats, Hatha yoga classes, wellness facilitation, exam practice papers and tutor matching.",
      "email": "hampsteadwellbeing@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Hampstead",
        "addressRegion": "London",
        "addressCountry": "GB"
      },
      "areaServed": "GB",
      "sameAs": [
        "https://www.findyogateachers.com",
        "https://www.findfitnessinstructors.com",
        "https://www.retreatlistings.com",
        "https://www.exampracticepapers.com",
        "https://www.find-tutors.co.uk"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Wellbeing & Education Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Self Appreciation Journeys — Yoga Retreat",
              "description": "Annual ladies-only residential yoga retreat for self-love in the Dordogne, France — seven days of yoga, meditation, self-love workshops and woodland walks in the Périgord Vert."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Weekly Hatha Yoga Classes",
              "description": "Term-time weekly in-person Hatha Yoga classes at a local London venue. Maximum 15 students per class."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Corporate Wellness Facilitation",
              "description": "Holistic, tailored solutions for organisations to mitigate burnout and stress, including coaching, group activities and wellness assessments."
            }
          }
        ]
      }
    }
    </script>
